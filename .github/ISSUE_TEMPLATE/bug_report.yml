name: Bug report
description: Report a problem with dsh-desktop
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below so the issue can be reproduced quickly.
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Windows 11 23H2, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node -v`
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: dsh version
      description: Output of `npm ls -g @deepseek-ai/dsh` (or "not installed")
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm start`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Run `npm start` from a terminal and paste the output here.
      render: text
  - type: checkboxes
    id: context
    attributes:
      label: Additional context
      options:
        - label: A `dsh web` server was already running on port 3080 when the bug occurred
