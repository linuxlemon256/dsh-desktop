name: Feature request
description: Suggest an idea for dsh-desktop
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! Describe the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does the app do today that makes you want this feature? What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature look and behave like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds you already tried?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I'd be willing to implement this and open a pull request
